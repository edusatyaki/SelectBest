<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalysisMaster Portal</title>
    <link rel="stylesheet" href="./index.css">
    <!-- Google Fonts for Tableau-like clean UI -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Plotly.js for Interactive Maps -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <h1>AnalysisMaster</h1>
            </div>
            <div class="upload-section">
                <div id="data-stats" class="data-stats" style="display: none;">
                    <span id="row-count">0</span> rows &nbsp;|&nbsp; <span id="col-count">0</span> cols
                </div>
                <input type="file" id="data-upload" accept=".csv, .json" hidden>
                <button class="btn-primary" onclick="document.getElementById('data-upload').click()">
                    Connect to Data
                </button>
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar for Columns -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>Data Area</h3>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="column-search" placeholder="Search..." disabled>
                </div>

                <div class="data-pane">
                    <div class="pane-section">
                        <h4>Dimensions (Categorical)</h4>
                        <div id="dimensions-list" class="column-list">
                            <div class="empty-state">Upload data first.</div>
                        </div>
                    </div>
                    
                    <div class="pane-section">
                        <h4>Measures (Numeric)</h4>
                        <div id="measures-list" class="column-list"></div>
                    </div>
                </div>
            </aside>

            <!-- Main Canvas -->
            <main id="dashboard" class="dashboard">
                <!-- BUILDER VIEW -->
                <div id="builder-view" class="view-container active">
                    <div class="dashboard-toolbar">
                        <h2>Dashboard Workspace</h2>
                        <div class="toolbar-actions">
                            <button id="clear-dashboard" class="btn-secondary" disabled>Clear Worksheet</button>
                        </div>
                    </div>

                    <div class="builder-grid">
                        <section class="builder-section" id="kpi-builder" data-section="kpi" data-size="1">
                            <div class="section-header">
                                <h4>KPI (1 var)</h4>
                            </div>
                            <div class="slot-list" id="kpi-slots"></div>
                            <button class="btn-add-slot" data-section="kpi">+ Add KPI</button>
                        </section>
                        
                        <section class="builder-section" id="univariate-builder" data-section="univariate" data-size="1">
                            <div class="section-header">
                                <h4>Univariate (1 var)</h4>
                            </div>
                            <div class="slot-list" id="univariate-slots"></div>
                            <button class="btn-add-slot" data-section="univariate">+ Add Univariate</button>
                        </section>
                        
                        <section class="builder-section" id="bivariate-builder" data-section="bivariate" data-size="2">
                            <div class="section-header">
                                <h4>Bivariate (2 vars)</h4>
                            </div>
                            <div class="slot-list" id="bivariate-slots"></div>
                            <button class="btn-add-slot" data-section="bivariate">+ Add Bivariate</button>
                        </section>
                        
                        <section class="builder-section" id="multivariate-builder" data-section="multivariate" data-size="3">
                            <div class="section-header">
                                <h4>Multi-Variate (3+ vars)</h4>
                            </div>
                            <div class="slot-list" id="multivariate-slots"></div>
                            <div class="multi-actions">
                                <button class="btn-add-slot" data-section="multivariate" data-size="3">+ Add 3</button>
                                <button class="btn-add-slot" data-section="multivariate" data-size="4">+ Add 4</button>
                                <button class="btn-add-slot" data-section="multivariate" data-size="5">+ Add 5</button>
                            </div>
                        </section>
                    </div>

                    <div class="generate-action-bar">
                        <button id="generate-dashboard" class="btn-primary btn-large" disabled>Generate Dashboard</button>
                    </div>
                </div>

                <!-- GENERATED VIEW -->
                <div id="generated-view" class="view-container">
                    <div class="dashboard-toolbar">
                        <h2>Generated Dashboard View</h2>
                        <div class="toolbar-actions">
                            <button id="download-pdf" class="btn-primary">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Export PDF
                            </button>
                            <button id="back-to-builder" class="btn-secondary">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                Back to Workspace
                            </button>
                        </div>
                    </div>
                    
                    <div id="dashboard-content" class="dashboard-content">
                        <!-- KPI Row -->
                        <div class="kpi-row" id="generated-kpi"></div>
                        <!-- Charts Grid -->
                        <div class="charts-grid" id="generated-charts"></div>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Footer -->
        <footer class="app-footer">
            &copy; 2026 Satyaki Das. All rights reserved.
        </footer>
    </div>
    
    <script src="./main.js"></script>
</body>
</html>
